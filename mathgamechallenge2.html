<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>喵喵數學大冒險 - P.2 Math Adventure</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #fdf4ff 0%, #fef3c7 50%, #e0f2fe 100%);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 4px solid #f472b6;
    }

    /* Native Input Overrides - Preventing iOS Safari zoom */
    input[type="tel"], input[type="number"] {
      font-size: 16px !important;
      touch-action: manipulation;
    }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type="number"] { -moz-appearance: textfield; }
    
    input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.4);
      background-color: #fffbeb !important;
      border-color: #f472b6 !important;
    }

    .key-btn {
      transition: transform 0.08s ease, background-color 0.15s ease;
      touch-action: manipulation;
    }
    .key-btn:active { transform: scale(0.92); }

    .active-cn-slot {
      border-color: #f59e0b !important;
      background-color: #fef3c7 !important;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.4);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
    }

    @keyframes smoke {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-18px, -24px) scale(1.4); opacity: 0; }
    }
    .smoke-puff { animation: smoke 2s infinite linear; }

    /* Compact Single-Screen Train Container */
    .train-compact-container {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      padding: 10px 2px;
      gap: 3px;
    }
  </style>
</head>
<body class="min-h-screen pb-16 text-slate-800">

  <!-- Application Header -->
  <header class="bg-pink-500 text-white shadow-md sticky top-0 z-30 border-b-4 border-pink-600">
    <div class="max-w-3xl mx-auto px-4 py-2.5 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl sm:text-3xl animate-bounce">🐱</span>
        <h1 class="text-lg sm:text-2xl font-black tracking-wide">喵喵數學大冒險</h1>
      </div>
      <div class="flex items-center space-x-3">
        <div class="bg-pink-600/90 border border-pink-300 px-3 py-1 rounded-full text-yellow-300 font-bold flex items-center gap-1.5 shadow-inner">
          <span class="text-xs sm:text-sm">🐾 得分:</span>
          <span id="score-display" class="text-base sm:text-lg font-black text-yellow-300">0</span>
        </div>
        <button onclick="toggleSound()" id="sound-toggle" class="bg-pink-400 hover:bg-pink-300 p-1.5 rounded-full text-base sm:text-lg shadow active:scale-90 transition">
          🔊
        </button>
      </div>
    </div>
    
    <!-- Stage Tabs Visual Indicator -->
    <div class="max-w-3xl mx-auto px-2 flex justify-around bg-pink-600/80 text-xs sm:text-sm font-bold">
      <div id="tab-A" class="py-1.5 px-1 sm:px-3 border-b-4 border-transparent text-white/60">Stage A 🧮</div>
      <div id="tab-B" class="py-1.5 px-1 sm:px-3 border-b-4 border-transparent text-white/60">Stage B 🔢</div>
      <div id="tab-C" class="py-1.5 px-1 sm:px-3 border-b-4 border-transparent text-white/60">Stage C 📐</div>
      <div id="tab-D" class="py-1.5 px-1 sm:px-3 border-b-4 border-transparent text-white/60">Stage D 🚂</div>
    </div>
  </header>

  <!-- Stage Progress Bar -->
  <div class="max-w-3xl mx-auto px-3 mt-3">
    <div class="bg-white/90 backdrop-blur rounded-2xl p-2.5 border-2 border-pink-200 shadow-sm flex items-center justify-between">
      <div class="font-black text-pink-700 text-xs sm:text-base flex items-center gap-2">
        <span id="stage-title-text"></span>
        <span id="stage-progress-text" class="bg-pink-100 text-pink-800 px-2 py-0.5 rounded-md border border-pink-200"></span>
      </div>
      <div class="w-1/3 sm:w-1/2 bg-slate-200 rounded-full h-3 shadow-inner overflow-hidden">
        <div id="progress-bar-fill" class="bg-gradient-to-r from-pink-400 to-yellow-400 h-full rounded-full transition-all duration-500 ease-out" style="width: 16.6%;"></div>
      </div>
    </div>
  </div>

  <!-- Main Workspace Area -->
  <main class="max-w-3xl mx-auto px-3 mt-3">

    <!-- ================= STAGE A ================= -->
    <section id="part-A" class="hidden space-y-4">
      <div class="game-card rounded-3xl p-4 sm:p-5 relative">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-base sm:text-xl font-black text-pink-700 flex items-center gap-1.5"><span>🧮</span> <span>珠串與三位數</span></h2>
          <span id="partA-type-badge" class="text-xs bg-purple-100 text-purple-800 font-black px-2.5 py-0.5 rounded-full border border-purple-300"></span>
        </div>

        <!-- Abacus Display -->
        <div class="bg-amber-50/80 rounded-2xl p-2.5 sm:p-3 border-2 border-amber-200 flex flex-col items-center shadow-inner">
          <div id="target-number-prompt" class="hidden mb-1.5 text-sm sm:text-lg font-black text-purple-900 bg-purple-100 px-3 py-1 rounded-full border border-purple-300 shadow-sm">
            🐱 請撥出數字：<span id="target-num-text" class="text-lg sm:text-xl text-rose-600 font-black"></span>
          </div>
          <svg id="abacus-svg" viewBox="0 0 300 160" class="w-full max-w-xs h-32 sm:h-40 drop-shadow"></svg>
          
          <div id="bead-controls" class="hidden flex justify-around w-full max-w-xs mt-2">
            <div class="flex gap-1 items-center bg-rose-50 p-1 rounded-xl border border-rose-200">
              <button onclick="changeBead('h', -1)" class="w-7 h-7 bg-rose-200 text-rose-900 rounded-lg font-black text-sm shadow active:scale-90">-</button>
              <span id="bead-count-h" class="font-black text-rose-900 w-4 text-center text-base">0</span>
              <button onclick="changeBead('h', 1)" class="w-7 h-7 bg-rose-500 text-white rounded-lg font-black text-sm shadow active:scale-90">+</button>
            </div>
            <div class="flex gap-1 items-center bg-teal-50 p-1 rounded-xl border border-teal-200">
              <button onclick="changeBead('t', -1)" class="w-7 h-7 bg-teal-200 text-teal-900 rounded-lg font-black text-sm shadow active:scale-90">-</button>
              <span id="bead-count-t" class="font-black text-teal-900 w-4 text-center text-base">0</span>
              <button onclick="changeBead('t', 1)" class="w-7 h-7 bg-teal-500 text-white rounded-lg font-black text-sm shadow active:scale-90">+</button>
            </div>
            <div class="flex gap-1 items-center bg-orange-50 p-1 rounded-xl border border-orange-200">
              <button onclick="changeBead('o', -1)" class="w-7 h-7 bg-orange-200 text-orange-900 rounded-lg font-black text-sm shadow active:scale-90">-</button>
              <span id="bead-count-o" class="font-black text-orange-900 w-4 text-center text-base">0</span>
              <button onclick="changeBead('o', 1)" class="w-7 h-7 bg-orange-500 text-white rounded-lg font-black text-sm shadow active:scale-90">+</button>
            </div>
          </div>
        </div>

        <!-- Inputs Section -->
        <div class="mt-3 space-y-3">
          <div id="section-read-inputs" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div class="bg-amber-50 p-2.5 rounded-2xl border-2 border-amber-300">
              <label class="block text-amber-950 font-bold mb-0.5 text-xs">寫作（阿拉伯數字）：</label>
              <input type="tel" id="input-write-arabic" class="bg-white border-2 border-amber-400 rounded-xl p-1.5 text-lg font-black text-center h-10 w-full text-amber-900" placeholder="用鍵盤輸入" autocomplete="off"/>
            </div>
            <div class="bg-emerald-50 p-2.5 rounded-2xl border-2 border-emerald-300 relative">
              <label class="block text-emerald-950 font-bold mb-0.5 text-xs">讀作（中國數字）：</label>
              <div id="input-write-chinese" onclick="openChineseKeypad()" class="bg-white border-2 border-emerald-400 rounded-xl p-1.5 text-lg font-black text-center h-10 flex items-center justify-center cursor-pointer shadow-inner text-emerald-900 relative">
              </div>
            </div>
          </div>

          <!-- Position Value Meaning -->
          <div class="bg-sky-50 p-3 rounded-2xl border-2 border-sky-300">
            <span class="font-black text-sky-950 text-xs sm:text-sm block mb-2">① 位值表示：</span>
            <div class="space-y-2 font-bold text-slate-800">
              <div class="flex items-center gap-2 flex-wrap bg-white p-1.5 rounded-xl border border-sky-200 shadow-sm">
                <input type="tel" id="input-digit-h" class="bg-slate-50 border-2 border-rose-400 rounded-lg w-12 h-9 text-center text-base font-black text-rose-700" autocomplete="off"/>
                <span class="text-slate-700 text-xs sm:text-sm">在百位，表示</span>
                <input type="tel" id="input-val-h" class="bg-slate-50 border-2 border-rose-400 rounded-lg w-16 h-9 text-center text-base font-black text-rose-700" autocomplete="off"/>
              </div>
              <div class="flex items-center gap-2 flex-wrap bg-white p-1.5 rounded-xl border border-sky-200 shadow-sm">
                <input type="tel" id="input-digit-t" class="bg-slate-50 border-2 border-teal-400 rounded-lg w-12 h-9 text-center text-base font-black text-teal-700" autocomplete="off"/>
                <span class="text-slate-700 text-xs sm:text-sm">在十位，表示</span>
                <input type="tel" id="input-val-t" class="bg-slate-50 border-2 border-teal-400 rounded-lg w-16 h-9 text-center text-base font-black text-teal-700" autocomplete="off"/>
              </div>
              <div class="flex items-center gap-2 flex-wrap bg-white p-1.5 rounded-xl border border-sky-200 shadow-sm">
                <input type="tel" id="input-digit-o" class="bg-slate-50 border-2 border-orange-400 rounded-lg w-12 h-9 text-center text-base font-black text-orange-700" autocomplete="off"/>
                <span class="text-slate-700 text-xs sm:text-sm">在個位，表示</span>
                <input type="tel" id="input-val-o" class="bg-slate-50 border-2 border-orange-400 rounded-lg w-16 h-9 text-center text-base font-black text-orange-700" autocomplete="off"/>
              </div>
            </div>
          </div>

          <!-- Expanded Sum Expression -->
          <div class="bg-purple-50 p-3 rounded-2xl border-2 border-purple-300">
            <span class="font-black text-purple-950 text-xs sm:text-sm block mb-1.5">② 分解位值算式：</span>
            <div class="flex items-center justify-center flex-wrap gap-1.5 text-sm sm:text-base font-bold bg-white p-2 rounded-xl border border-purple-200 shadow-sm">
              <input type="tel" id="input-exp-total" class="bg-slate-50 border-2 border-purple-400 rounded-lg w-14 sm:w-16 h-9 text-center text-base font-black text-purple-800" autocomplete="off"/>
              <span class="text-base font-black text-purple-900">= (</span>
              <input type="tel" id="input-exp-h" class="bg-slate-50 border-2 border-purple-400 rounded-lg w-14 h-9 text-center text-base font-black text-purple-700" autocomplete="off"/>
              <span class="text-base font-black text-purple-900">) + (</span>
              <input type="tel" id="input-exp-t" class="bg-slate-50 border-2 border-purple-400 rounded-lg w-12 h-9 text-center text-base font-black text-purple-700" autocomplete="off"/>
              <span class="text-base font-black text-purple-900">) + (</span>
              <input type="tel" id="input-exp-o" class="bg-slate-50 border-2 border-purple-400 rounded-lg w-10 h-9 text-center text-base font-black text-purple-700" autocomplete="off"/>
              <span class="text-base font-black text-purple-900">)</span>
            </div>
          </div>
        </div>
        <div class="mt-4 flex justify-center">
          <button onclick="checkStageA()" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-black px-8 py-3 rounded-2xl shadow-lg active:scale-95 transition">喵喵確認答案 ✅</button>
        </div>
      </div>
    </section>

    <!-- ================= STAGE B ================= -->
    <section id="part-B" class="hidden space-y-4">
      <div class="game-card rounded-3xl p-4 sm:p-6 text-center">
        <h2 class="text-base sm:text-xl font-black text-pink-800 mb-1 flex items-center justify-center gap-1.5">
          <span>🔢</span> <span>三位數比較</span>
        </h2>
        <div id="b-prompt" class="text-sm sm:text-lg font-black text-purple-900 bg-purple-100 py-2 px-3 rounded-2xl border border-purple-200 my-3 shadow-sm"></div>

        <div class="grid grid-cols-3 gap-2.5 my-4 max-w-md mx-auto">
          <div onclick="clickNumCard(0)" id="num-card-0" class="bg-amber-100 hover:bg-amber-200 border-2 border-amber-400 rounded-2xl p-3 cursor-pointer hover:scale-105 transition shadow-md text-2xl sm:text-3xl font-black text-amber-950"></div>
          <div onclick="clickNumCard(1)" id="num-card-1" class="bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-400 rounded-2xl p-3 cursor-pointer hover:scale-105 transition shadow-md text-2xl sm:text-3xl font-black text-emerald-950"></div>
          <div onclick="clickNumCard(2)" id="num-card-2" class="bg-purple-100 hover:bg-purple-200 border-2 border-purple-400 rounded-2xl p-3 cursor-pointer hover:scale-105 transition shadow-md text-2xl sm:text-3xl font-black text-purple-950"></div>
        </div>

        <div class="bg-indigo-50 p-3.5 rounded-2xl border border-indigo-200 my-4 shadow-inner">
          <div class="text-xs font-bold text-indigo-900 mb-2">（點擊上方數字卡片填入下方位置）</div>
          <div class="flex justify-center items-center gap-1.5 sm:gap-3">
            <div id="slot-b-1" class="w-20 sm:w-24 h-12 bg-white border-2 border-amber-400 rounded-xl flex items-center justify-center text-lg sm:text-xl font-black text-amber-900 shadow"></div>
            <span id="b-sym-1" class="font-black text-indigo-700 text-2xl"></span>
            <div id="slot-b-2" class="w-20 sm:w-24 h-12 bg-white border-2 border-amber-400 rounded-xl flex items-center justify-center text-lg sm:text-xl font-black text-amber-900 shadow"></div>
            <span id="b-sym-2" class="font-black text-indigo-700 text-2xl"></span>
            <div id="slot-b-3" class="w-20 sm:w-24 h-12 bg-white border-2 border-amber-400 rounded-xl flex items-center justify-center text-lg sm:text-xl font-black text-amber-900 shadow"></div>
          </div>
        </div>

        <div class="flex justify-center gap-2">
          <button onclick="resetBOrder()" class="bg-slate-300 hover:bg-slate-400 text-slate-800 font-black px-4 py-2.5 rounded-xl text-xs sm:text-sm shadow">重新排序 🔄</button>
          <button onclick="checkStageB()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black px-6 py-2.5 rounded-xl text-xs sm:text-sm shadow-lg">喵喵確認答案 ✅</button>
        </div>
      </div>
    </section>

    <!-- ================= STAGE C ================= -->
    <section id="part-C" class="hidden space-y-4">
      <div id="box-C" class="game-card rounded-3xl p-4 sm:p-5 text-center">
        <!-- Rendered dynamically via JS -->
      </div>
    </section>

    <!-- ================= STAGE D (COMPACT SINGLE SCREEN TRAIN) ================= -->
    <section id="part-D" class="hidden space-y-4">
      <div class="game-card rounded-3xl p-3 sm:p-5">
        <h2 class="text-base sm:text-xl font-black text-pink-800 mb-1 flex items-center justify-center gap-1.5">
          <span>🚂</span> <span>喵喵火車規律</span>
        </h2>
        <p class="text-xs text-slate-600 font-bold mb-2 text-center">觀察喵喵彩虹火車，在空白車廂填入正確數字：</p>
        
        <div id="train-wrapper" class="bg-gradient-to-b from-sky-200 via-indigo-50 to-emerald-100 rounded-2xl p-2 border-2 border-sky-300 relative overflow-hidden shadow-inner w-full max-w-full">
           <!-- Rendered dynamically -->
        </div>

        <div class="mt-4 flex justify-center">
          <button onclick="checkStageD()" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-black px-8 py-3 rounded-2xl shadow-lg active:scale-95 transition">喵喵確認答案 ✅</button>
        </div>
      </div>
    </section>

    <!-- ================= DEDICATED CHINESE KEYPAD ================= -->
    <div id="keypad-container" class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t-4 border-emerald-400 p-2.5 sm:p-3 shadow-[0_-10px_20px_rgba(0,0,0,0.1)] hidden transform transition-transform duration-300 translate-y-full">
      <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-1.5 px-1">
          <span class="font-black text-emerald-800 text-xs sm:text-sm flex items-center gap-1"><span>⌨️</span><span> 中國數字鍵盤</span></span>
          <button onclick="hideChineseKeypad()" class="bg-slate-200 text-slate-600 hover:bg-slate-300 rounded-full w-7 h-7 flex items-center justify-center font-bold text-xs">✕</button>
        </div>
        <div class="grid grid-cols-5 gap-1 sm:gap-1.5">
          <button onclick="pressCnKey('零')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">零</button>
          <button onclick="pressCnKey('一')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">一</button>
          <button onclick="pressCnKey('二')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">二</button>
          <button onclick="pressCnKey('三')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">三</button>
          <button onclick="pressCnKey('四')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">四</button>
          <button onclick="pressCnKey('五')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">五</button>
          <button onclick="pressCnKey('六')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">六</button>
          <button onclick="pressCnKey('七')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">七</button>
          <button onclick="pressCnKey('八')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">八</button>
          <button onclick="pressCnKey('九')" class="key-btn bg-white border-2 border-emerald-200 text-emerald-900 text-base font-black p-2 rounded-xl shadow">九</button>
          <button onclick="pressCnKey('百')" class="key-btn bg-amber-200 text-amber-950 border-2 border-amber-300 text-base font-black p-2 rounded-xl shadow">百</button>
          <button onclick="pressCnKey('十')" class="key-btn bg-amber-200 text-amber-950 border-2 border-amber-300 text-base font-black p-2 rounded-xl shadow">十</button>
          <button onclick="pressCnKey('BACK')" class="key-btn bg-rose-100 text-rose-900 border-2 border-rose-200 text-xs font-black p-2 rounded-xl shadow col-span-2">退格 ⌫</button>
          <button onclick="pressCnKey('CLEAR')" class="key-btn bg-slate-200 text-slate-700 border-2 border-slate-300 text-xs font-black p-2 rounded-xl shadow col-span-1">清空</button>
        </div>
      </div>
    </div>

  </main>

  <!-- Grand Victory Overlay -->
  <div id="victory-screen" class="hidden fixed inset-0 bg-pink-500 z-50 flex flex-col items-center justify-center p-6 space-y-6">
    <div class="text-7xl sm:text-8xl animate-bounce">🏆</div>
    <h1 class="text-3xl sm:text-5xl font-black text-white text-center drop-shadow-lg">大冒險完成！</h1>
    <div class="bg-white/20 p-6 rounded-3xl backdrop-blur-md border-2 border-white/50 text-center shadow-xl">
      <p class="text-white font-bold text-lg mb-1">你的總得分</p>
      <p id="final-score" class="text-5xl sm:text-6xl font-black text-yellow-300 drop-shadow-md">0</p>
    </div>
    <button onclick="location.reload()" class="bg-white text-pink-600 font-black text-lg sm:text-xl px-8 py-3.5 rounded-full shadow-2xl hover:scale-105 transition-transform">
      再玩一次 🔄
    </button>
  </div>

  <!-- Universal Modal -->
  <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div id="modal-card" class="bg-white rounded-3xl p-5 max-w-xs sm:max-w-sm w-full text-center shadow-2xl space-y-3">
      <div id="modal-icon" class="text-5xl animate-bounce">🐱</div>
      <h3 id="modal-title" class="text-xl sm:text-2xl font-black"></h3>
      <p id="modal-message" class="text-xs sm:text-sm font-bold text-slate-600 leading-relaxed"></p>
      <button id="modal-btn" onclick="closeModal()" class="w-full font-black py-3 rounded-2xl shadow-lg text-sm sm:text-base active:scale-95 transition"></button>
    </div>
  </div>

  <script>
    // System Config
    const Q_PER_STAGE = 6;
    let soundEnabled = true;
    let audioCtx = null;
    let currentScore = 0;
    
    // Core Game State
    let state = {
      stage: 'A', // A, B, C, D
      qCount: 1
    };

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTone(f, type, dur) {
      if (!soundEnabled) return;
      try { 
        initAudio(); 
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type; osc.frequency.value = f;
        g.gain.setValueAtTime(0.15, audioCtx.currentTime); 
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + dur); 
      } catch(e){}
    }
    function playCorrectSound() { 
      playTone(523, 'triangle', 0.1); 
      setTimeout(()=>playTone(659, 'triangle', 0.1), 80); 
      setTimeout(()=>playTone(784, 'triangle', 0.2), 160); 
    }
    function playWrongSound() { 
      playTone(220, 'sawtooth', 0.15); 
      setTimeout(()=>playTone(170, 'sawtooth', 0.2), 120); 
    }
    function toggleSound() { 
      soundEnabled = !soundEnabled; 
      document.getElementById('sound-toggle').innerText = soundEnabled ? '🔊' : '🔇'; 
    }
    function triggerConfetti() { 
      try { confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } }); } catch(e){} 
    }
    function addScore(pts) { 
      currentScore += pts; 
      document.getElementById('score-display').innerText = currentScore; 
    }

    // Navigation & Header UI
    function updateHeaderUI(title) {
      document.getElementById('stage-title-text').innerText = `Stage ${state.stage}: ${title}`;
      document.getElementById('stage-progress-text').innerText = `第 ${state.qCount} / ${Q_PER_STAGE} 題`;
      document.getElementById('progress-bar-fill').style.width = `${(state.qCount/Q_PER_STAGE)*100}%`;
      
      ['A','B','C','D'].forEach(s => {
        document.getElementById(`part-${s}`).classList.add('hidden');
        const tab = document.getElementById(`tab-${s}`);
        if (s === state.stage) {
          tab.className = "py-1.5 px-1 sm:px-3 border-b-4 border-yellow-300 text-yellow-300";
        } else {
          tab.className = "py-1.5 px-1 sm:px-3 border-b-4 border-transparent text-white/60";
        }
      });
      document.getElementById(`part-${state.stage}`).classList.remove('hidden');
    }

    // Modal Notification System
    let modalCallback = null;
    function showModal(isSuccess, title, msg, btnText, callback) {
      hideChineseKeypad(); // Ensure keypad is hidden
      modalCallback = callback;
      const overlay = document.getElementById('modal-overlay');
      const card = document.getElementById('modal-card');
      const icon = document.getElementById('modal-icon');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');
      const btn = document.getElementById('modal-btn');

      if (isSuccess) {
        card.className = "bg-white rounded-3xl p-5 max-w-xs sm:max-w-sm w-full text-center border-4 border-emerald-400 shadow-2xl space-y-3";
        icon.innerText = "🐱🎉"; titleEl.className = "text-xl sm:text-2xl font-black text-emerald-600";
        btn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 rounded-2xl shadow-lg active:scale-95 text-sm sm:text-base";
      } else {
        card.className = "bg-white rounded-3xl p-5 max-w-xs sm:max-w-sm w-full text-center border-4 border-rose-400 shadow-2xl space-y-3";
        icon.innerText = "🐱🐾"; titleEl.className = "text-xl sm:text-2xl font-black text-rose-600";
        btn.className = "w-full bg-rose-500 hover:bg-rose-600 text-white font-black py-3 rounded-2xl shadow-lg active:scale-95 text-sm sm:text-base";
      }
      
      titleEl.innerText = title; msgEl.innerText = msg; btn.innerText = btnText;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      if (modalCallback) { modalCallback(); modalCallback = null; }
    }

    // Dedicated Chinese Keypad Mechanics
    let cnVal = '';
    function openChineseKeypad() {
      if(document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
      const kc = document.getElementById('keypad-container');
      kc.classList.remove('hidden');
      setTimeout(() => kc.classList.remove('translate-y-full'), 10);
      document.getElementById('input-write-chinese').classList.add('active-cn-slot');
    }
    function hideChineseKeypad() {
      const kc = document.getElementById('keypad-container');
      kc.classList.add('translate-y-full');
      setTimeout(() => kc.classList.add('hidden'), 300);
      const el = document.getElementById('input-write-chinese');
      if (el) el.classList.remove('active-cn-slot');
    }
    function pressCnKey(key) {
      playTone(450, 'sine', 0.03);
      if(key === 'CLEAR') cnVal = '';
      else if(key === 'BACK') cnVal = cnVal.slice(0, -1);
      else cnVal += key;
      document.getElementById('input-write-chinese').innerHTML = cnVal === '' ? '<span class="absolute right-2 text-xs text-emerald-500 opacity-60">⌨️ 點擊輸入</span>' : cnVal;
    }

    // Start Application
    window.onload = () => initStageA();

    // ================= STAGE A LOGIC =================
    let targetA = 0; let beadsA = {h:0, t:0, o:0}; let modeA = 'read';
    
    function initStageA() {
      state.stage = 'A'; state.qCount = 1;
      buildStageA();
    }
    function buildStageA() {
      updateHeaderUI('珠串與三位數');
      modeA = Math.random() > 0.5 ? 'read' : 'bead';
      targetA = Math.floor(Math.random() * 899) + 100;
      
      const badge = document.getElementById('partA-type-badge');
      badge.innerText = modeA === 'read' ? '看圖寫數與位值' : '看數撥珠與位值';
      badge.className = modeA === 'read' ? "text-xs bg-purple-100 text-purple-800 font-black px-2.5 py-0.5 rounded-full border border-purple-300" : "text-xs bg-rose-100 text-rose-800 font-black px-2.5 py-0.5 rounded-full border border-rose-300";

      document.getElementById('section-read-inputs').style.display = modeA === 'read' ? 'grid' : 'none';
      document.getElementById('target-number-prompt').classList.toggle('hidden', modeA === 'read');
      document.getElementById('bead-controls').classList.toggle('hidden', modeA === 'read');
      document.getElementById('target-num-text').innerText = targetA;

      // Blank out all native input fields
      ['write-arabic', 'digit-h', 'val-h', 'digit-t', 'val-t', 'digit-o', 'val-o', 'exp-total', 'exp-h', 'exp-t', 'exp-o'].forEach(id => {
        const el = document.getElementById(`input-${id}`); if(el) el.value = '';
      });
      // Blank out Chinese input slot
      cnVal = ''; document.getElementById('input-write-chinese').innerHTML = '<span class="absolute right-2 text-xs text-emerald-500 opacity-60">⌨️ 點擊輸入</span>';
      
      if(modeA === 'read') beadsA = {h: Math.floor(targetA/100), t: Math.floor((targetA%100)/10), o: targetA%10};
      else beadsA = {h:0, t:0, o:0};
      
      renderAbacus();
    }
    function renderAbacus() {
      let svg = `
        <rect x="20" y="15" width="260" height="130" rx="10" fill="#8B4513" stroke="#5c2d0c" stroke-width="4"/>
        <rect x="30" y="25" width="240" height="110" fill="#FFF8DC"/>
        <line x1="70" y1="25" x2="70" y2="135" stroke="#94a3b8" stroke-width="5"/>
        <line x1="150" y1="25" x2="150" y2="135" stroke="#94a3b8" stroke-width="5"/>
        <line x1="230" y1="25" x2="230" y2="135" stroke="#94a3b8" stroke-width="5"/>
        <rect x="48" y="136" width="44" height="16" rx="4" fill="#f43f5e" /><text x="70" y="148" text-anchor="middle" font-weight="900" fill="#fff" font-size="10">百位</text>
        <rect x="128" y="136" width="44" height="16" rx="4" fill="#0D9488" /><text x="150" y="148" text-anchor="middle" font-weight="900" fill="#fff" font-size="10">十位</text>
        <rect x="208" y="136" width="44" height="16" rx="4" fill="#ea580c" /><text x="230" y="148" text-anchor="middle" font-weight="900" fill="#fff" font-size="10">個位</text>
      `;
      ['h','t','o'].forEach(rod => {
        const cx = rod==='h'?70 : rod==='t'?150 : 230; const col = rod==='h'?'#f43f5e':rod==='t'?'#0D9488':'#ea580c';
        for(let i=0; i<beadsA[rod]; i++) svg += `<ellipse cx="${cx}" cy="${126 - i*10}" rx="12" ry="4" fill="${col}" stroke="#1e293b" stroke-width="1.2"/>`;
        const lbl = document.getElementById(`bead-count-${rod}`); if(lbl) lbl.innerText = beadsA[rod];
      });
      document.getElementById('abacus-svg').innerHTML = svg;
    }
    function changeBead(rod, d) { beadsA[rod] = Math.max(0, Math.min(9, beadsA[rod]+d)); renderAbacus(); }
    function numToCn(n) {
      const c = ['零','一','二','三','四','五','六','七','八','九'];
      const h = Math.floor(n/100), t = Math.floor((n%100)/10), o = n%10;
      let r = c[h]+'百';
      if(t===0 && o===0) return r;
      if(t===0) return r+'零'+c[o];
      r += c[t]+'十';
      if(o!==0) r += c[o];
      return r;
    }
    function checkStageA() {
      const h = Math.floor(targetA/100), t = Math.floor((targetA%100)/10), o = targetA%10;
      let pass = true;
      if (modeA === 'bead') { if(beadsA.h!==h || beadsA.t!==t || beadsA.o!==o) pass=false; }
      else { if(document.getElementById('input-write-arabic').value.trim() !== targetA.toString() || cnVal !== numToCn(targetA)) pass=false; }
      
      const chk = (id, val) => document.getElementById(id).value.trim() === val.toString();
      if(!chk('input-digit-h',h) || !chk('input-val-h',h*100) || !chk('input-digit-t',t) || !chk('input-val-t',t*10) || !chk('input-digit-o',o) || !chk('input-val-o',o)) pass=false;
      if(!chk('input-exp-total',targetA) || !chk('input-exp-h',h*100) || !chk('input-exp-t',t*10) || !chk('input-exp-o',o)) pass=false;

      if(pass) handleSuccess(buildStageA, initStageB, 'Stage A', '進入 Stage B');
      else { playWrongSound(); showModal(false, "喵喵提醒你", "有地方填錯了，請仔細檢查所有數字喔！", "再試一次", null); }
    }

    // ================= STAGE B LOGIC =================
    let numsB = [], orderB = 'asc', userB = [];
    function initStageB() { state.stage = 'B'; state.qCount = 1; buildStageB(); }
    function buildStageB() {
      updateHeaderUI('三位數比較');
      orderB = Math.random()>0.5 ? 'asc' : 'desc';
      numsB = [];
      while(numsB.length<3) { const n = Math.floor(Math.random()*899)+100; if(!numsB.includes(n)) numsB.push(n); }
      for(let i=0; i<3; i++) document.getElementById(`num-card-${i}`).innerText = numsB[i];
      
      document.getElementById('b-prompt').innerText = orderB==='asc' ? '請將下列各組數【由小至大】排列：' : '請將下列各組數【由大至小】排列：';
      document.getElementById('b-sym-1').innerText = orderB==='asc'?'<':'>';
      document.getElementById('b-sym-2').innerText = orderB==='asc'?'<':'>';
      resetBOrder();
    }
    function clickNumCard(idx) {
      if(userB.length<3 && !userB.includes(numsB[idx])) {
        userB.push(numsB[idx]);
        for(let i=1; i<=3; i++) document.getElementById(`slot-b-${i}`).innerText = userB[i-1] ? userB[i-1] : '';
      }
    }
    function resetBOrder() { userB = []; for(let i=1; i<=3; i++) document.getElementById(`slot-b-${i}`).innerText=''; }
    function checkStageB() {
      if(userB.length<3) { showModal(false, "還未排完喔！", "請點擊上方所有 3 個數字卡片填入下方！", "繼續", null); return; }
      const sorted = [...numsB].sort((a,b)=> orderB==='asc'?a-b:b-a);
      if(userB.join(',') === sorted.join(',')) handleSuccess(buildStageB, initStageC, 'Stage B', '進入 Stage C');
      else { playWrongSound(); showModal(false, "排列不正確喔", "請重新比較百位和十位數字的大小！", "再試一次", null); }
    }

    // ================= STAGE C LOGIC =================
    let modeC = 'count', cCount = 0, cAngs = {}, cOrder = 'desc', userC = [];
    function initStageC() { state.stage = 'C'; state.qCount = 1; buildStageC(); }
    function buildStageC() {
      updateHeaderUI('角與圖形');
      modeC = Math.random()>0.5 ? 'count' : 'compare';
      const box = document.getElementById('box-C');
      
      if(modeC === 'count') {
        const shapes = [
          { n:'triangle', c:3, h:`<polygon points="100,20 30,125 170,125" fill="#fef08a" stroke="#ca8a04" stroke-width="4"/>` },
          { n:'rectangle', c:4, h:`<rect x="35" y="30" width="130" height="90" fill="#bbf7d0" stroke="#16a34a" stroke-width="4"/>` },
          { n:'pentagon', c:5, h:`<polygon points="100,20 165,65 140,130 60,130 35,65" fill="#c7d2fe" stroke="#4f46e5" stroke-width="4"/>` },
          { n:'hexagon', c:6, h:`<polygon points="100,15 155,45 155,105 100,135 45,105 45,45" fill="#fbcfe8" stroke="#db2777" stroke-width="4"/>` },
          { n:'circle', c:0, h:`<circle cx="100" cy="75" r="50" fill="#fed7aa" stroke="#ea580c" stroke-width="4"/>` }
        ];
        const s = shapes[Math.floor(Math.random()*shapes.length)]; cCount = s.c;
        box.innerHTML = `
          <h2 class="text-base sm:text-lg font-black text-pink-800 mb-1">🐱 圖中有多少隻角？</h2>
          <p class="text-xs text-slate-500 font-bold mb-2">（注意：圓滑曲線沒有角喔！）</p>
          <div class="bg-sky-50 rounded-2xl p-3 my-2 flex justify-center border-2 border-sky-200 shadow-inner">
            <svg viewBox="0 0 200 150" class="w-44 h-32 drop-shadow">${s.h}</svg>
          </div>
          <div class="flex items-center justify-center gap-2">
            <span class="font-bold text-xs sm:text-sm text-slate-800">圖中有：</span>
            <input type="tel" id="input-c-count" class="bg-white border-2 border-emerald-500 rounded-xl w-18 h-10 text-center text-lg font-black text-emerald-700 shadow-inner" autocomplete="off"/>
            <span class="font-bold text-xs sm:text-sm text-slate-800">隻角</span>
          </div>
          <div class="mt-4"><button onclick="checkStageC()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black text-sm px-8 py-3 rounded-2xl shadow-lg active:scale-95">喵喵確認答案 ✅</button></div>
        `;
      } else {
        const arr = [30+Math.floor(Math.random()*30), 80+Math.floor(Math.random()*20), 120+Math.floor(Math.random()*40)].sort(()=>Math.random()-0.5);
        cAngs = {A:arr[0], B:arr[1], C:arr[2]}; cOrder = Math.random()>0.5 ? 'desc' : 'asc'; userC = [];
        const genSVG = (deg) => {
          const r=(-deg*Math.PI)/180, cx=80, cy=80;
          let arc = `<path d="M ${cx+14} ${cy} A 14 14 0 0 0 ${cx+14*Math.cos(r)} ${cy+14*Math.sin(r)}" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2,2"/>`;
          if(deg===90) arc = `<rect x="${cx}" y="${cy-10}" width="10" height="10" fill="none" stroke="#ef4444" stroke-width="2" />`;
          return `<line x1="${cx}" y1="${cy}" x2="${cx+45}" y2="${cy}" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${cx+45*Math.cos(r)}" y2="${cy+45*Math.sin(r)}" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>${arc}`;
        };
        const sym = cOrder==='desc'?'>':'<';
        box.innerHTML = `
          <h2 class="text-xs sm:text-base font-black text-purple-900 mb-2 bg-purple-100 py-1.5 rounded-2xl border border-purple-200">請按【由${cOrder==='desc'?'大至小':'小至大'}】排列：</h2>
          <div class="grid grid-cols-3 gap-2 my-2">
            ${['A','B','C'].map(k => `
              <div onclick="clickCAngle('${k}')" class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-1 cursor-pointer hover:scale-105 shadow">
                <span class="bg-amber-500 text-white font-black px-2 py-0.5 rounded-full text-[10px]">角 ${k}</span>
                <svg viewBox="0 0 150 100" class="w-full h-14 mt-0.5">${genSVG(cAngs[k])}</svg>
              </div>
            `).join('')}
          </div>
          <div class="bg-indigo-50 p-2.5 rounded-2xl border border-indigo-200 my-2 flex justify-center items-center gap-1.5 font-black text-indigo-950">
            <div id="slot-c-1" class="w-14 h-10 bg-white border-2 border-amber-400 rounded-xl flex items-center justify-center text-sm text-amber-900 shadow"></div>
            <span class="text-lg">${sym}</span>
            <div id="slot-c-2" class="w-14 h-10 bg-white border-2 border-amber-400 rounded-xl flex items-center justify-center text-sm text-amber-900 shadow"></div>
            <span class="text-lg">${sym}</span>
            <div id="slot-c-3" class="w-14 h-10 bg-white border-2 border-amber-400 rounded-xl flex items-center justify-center text-sm text-amber-900 shadow"></div>
          </div>
          <div class="flex justify-center gap-2 mt-3"><button onclick="userC=[]; updateCSlots();" class="bg-slate-300 px-3 py-1.5 rounded-xl text-xs font-black">重新排序</button><button onclick="checkStageC()" class="bg-emerald-500 text-white px-5 py-1.5 rounded-xl text-xs font-black shadow">喵喵確認答案</button></div>
        `;
      }
    }
    function clickCAngle(k) { if(userC.length<3 && !userC.includes(k)) { userC.push(k); updateCSlots(); } }
    function updateCSlots() { for(let i=1; i<=3; i++) { const e=document.getElementById(`slot-c-${i}`); if(e) e.innerText = userC[i-1]?`角 ${userC[i-1]}`:''; } }
    function checkStageC() {
      if(modeC==='count') {
        if(document.getElementById('input-c-count').value.trim() === cCount.toString()) handleSuccess(buildStageC, initStageD, 'Stage C', '進入 Stage D');
        else { playWrongSound(); showModal(false, "不正確喔", "請仔細數角，圓滑曲線沒有角！", "再試一次", null); }
      } else {
        if(userC.length<3) { showModal(false, "還未排完喔！", "請點擊所有角", "繼續", null); return; }
        const sort = ['A','B','C'].sort((x,y)=> cOrder==='desc'?cAngs[y]-cAngs[x]:cAngs[x]-cAngs[y]);
        if(userC.join('')===sort.join('')) handleSuccess(buildStageC, initStageD, 'Stage C', '進入 Stage D');
        else { playWrongSound(); showModal(false, "排列不正確喔", "重新觀察角的大小", "再試一次", null); }
      }
    }

    // ================= STAGE D LOGIC (COMPACT TRAIN) =================
    let trainD = [];
    function initStageD() { state.stage = 'D'; state.qCount = 1; buildStageD(); }
    function buildStageD() {
      updateHeaderUI('喵喵火車規律');
      const step = [1, -1, 2, -2, 5, -5, 10, -10, 100, -100][Math.floor(Math.random()*10)];
      let start = Math.floor(Math.random()*(999-100)) + 100;
      if(step>0 && start+4*step>999) start = 999-4*step;
      if(step<0 && start+4*step<100) start = 100-4*step;
      
      trainD = Array(5).fill().map((_,i)=>({ v:start+i*step, b:false }));
      const bIdx = [0,1,2,3,4].sort(()=>Math.random()-0.5).slice(0,2);
      bIdx.forEach(i=> trainD[i].b = true);

      // Render Compact Train without horizontal overflow
      let html = `<div class="train-compact-container items-end">
        <!-- Engine Locomotive -->
        <div class="flex-shrink-0 flex flex-col items-center mr-0.5 relative">
          <div class="smoke-puff text-xs absolute -top-4 left-2">💨</div>
          <div class="bg-rose-500 border-2 border-rose-700 rounded-t-xl w-[52px] sm:w-[68px] h-[52px] sm:h-[64px] relative flex flex-col justify-between p-0.5 shadow">
            <div class="bg-amber-300 w-5 h-5 rounded-full border border-amber-500 flex items-center justify-center text-[10px] shadow">🐱</div>
            <div class="bg-rose-800 h-3 rounded w-full flex items-center justify-center text-white text-[8px] font-bold">喵喵車長</div>
          </div>
          <div class="flex justify-between w-12 -mt-1.5 z-10 gap-0.5"><div class="w-3.5 h-3.5 bg-slate-800 rounded-full border border-slate-300"></div><div class="w-3.5 h-3.5 bg-slate-800 rounded-full border border-slate-300"></div></div>
        </div>
        
        <!-- 5 Compact Carriages -->
        <div class="flex items-end gap-1">`;
      
      const cols = ['orange','teal','purple','emerald','pink'], hex = ['#f97316','#14b8a6','#a855f7','#10b981','#ec4899'];
      trainD.forEach((d,i) => {
        let box = d.b ? `<div class="bg-white border-2 border-amber-400 w-full h-8 rounded flex items-center justify-center mt-0.5 shadow-inner overflow-hidden"><input type="tel" id="td-in-${i}" class="w-full h-full text-center text-xs sm:text-sm font-black text-amber-700 outline-none bg-transparent" autocomplete="off"/></div>`
                      : `<div class="bg-slate-100 w-full h-8 rounded flex items-center justify-center mt-0.5 border border-${cols[i]}-300 text-xs sm:text-sm font-black text-slate-800">${d.v}</div>`;
        html += `<div class="flex-shrink-0"><div class="border-2 border-${cols[i]}-600 rounded-lg w-[54px] sm:w-[72px] h-[56px] sm:h-[68px] flex flex-col items-center justify-center p-0.5 shadow" style="background-color:${hex[i]}"><span class="text-[8px] font-black text-white bg-black/30 px-1 rounded">${i+1}號車</span>${box}</div>
        <div class="flex justify-between px-1 -mt-1.5"><div class="w-3 h-3 bg-slate-800 rounded-full border border-slate-300"></div><div class="w-3 h-3 bg-slate-800 rounded-full border border-slate-300"></div></div></div>`;
      });
      html += `</div></div><div class="h-2 bg-amber-900 w-full rounded border-t border-amber-950 -mt-1"></div>`;
      document.getElementById('train-wrapper').innerHTML = html;
    }
    function checkStageD() {
      let pass = true;
      trainD.forEach((d,i) => { if(d.b && document.getElementById(`td-in-${i}`).value.trim()!==d.v.toString()) pass=false; });
      if(pass) handleSuccess(buildStageD, showVictory, 'Stage D', '完成大冒險');
      else { playWrongSound(); showModal(false, "數字規律有錯喔", "仔細檢查前後車廂的規律！", "再試一次", null); }
    }

    // ================= STAGE PROGRESSION CONTROLLER =================
    function handleSuccess(buildCurrentStageFn, nextStageInitFn, stageTitle, nextBtnTxt) {
      playCorrectSound(); triggerConfetti(); addScore(10);
      if (state.qCount < Q_PER_STAGE) {
        state.qCount++;
        showModal(true, "太棒了！答對了！🎉", "", "下一題 ➡️", () => buildCurrentStageFn());
      } else {
        addScore(50); // Stage clear bonus
        if(state.stage === 'D') { showVictory(); return; }
        showModal(true, `${stageTitle} 完成！🏆`, "太厲害了！準備好迎接下一關了嗎？", nextBtnTxt + " 🚀", () => nextStageInitFn());
      }
    }
    function showVictory() {
      hideChineseKeypad();
      document.getElementById('final-score').innerText = currentScore;
      document.getElementById('victory-screen').classList.remove('hidden');
      triggerConfetti(); setInterval(triggerConfetti, 1500);
    }
  </script>
</body>
</html>
